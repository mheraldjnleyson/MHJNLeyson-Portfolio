<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#0e1626" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="13" ry="13" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="12" ry="12" fill="none" stroke="url(#grad)" stroke-width="1.5" opacity="0.35" />
  <text x="32" y="48" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-weight="700" font-size="44" fill="url(#grad)" filter="url(#glow)">M</text>
</svg>
